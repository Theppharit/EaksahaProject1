<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prototype เดินตาม Flow — ระบบจัดการรถสไลด์ & จองคิวรถยก</title>
<style>
  :root{
    --page:#f4f5f3; --surface:#fcfcfb; --ink-1:#0b0b0b; --ink-2:#52514e; --ink-3:#898781;
    --hairline:#e1e0d9; --border:rgba(11,11,11,.10);
    --brand:#2a78d6; --brand-dark:#1c5cab; --brand-soft:#e3eefb;
    --good:#0ca30c; --good-text:#006300; --good-bg:#e8f6e8;
    --warning:#fab219; --warning-text:#7a5200; --warning-bg:#fdf3dc;
    --critical:#d03b3b; --critical-text:#a02020; --critical-bg:#fbe9e9;
    --violet:#4a3aa7; --violet-bg:#eae7f8;
    --aqua:#1baf7a; --aqua-bg:#e2f5ee; --aqua-text:#0e7a54;
    --orange:#eb6834; --orange-bg:#fdeae2; --orange-text:#b34a1e;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    font-family:system-ui,-apple-system,"Segoe UI","Leelawadee UI","Noto Sans Thai",Tahoma,sans-serif;
    background:var(--page); color:var(--ink-1); font-size:14px; line-height:1.55;
  }

  /* ── Top bar ── */
  .topbar{
    background:#122a44;color:#fff;padding:12px 22px;display:flex;align-items:center;gap:16px;
    flex-wrap:wrap;position:sticky;top:0;z-index:30;
  }
  .topbar .brand{font-size:15px;font-weight:700;white-space:nowrap;}
  .topbar .brand small{display:block;font-size:10px;color:#8fb4de;font-weight:400;}
  .roles{display:flex;gap:6px;flex-wrap:wrap;flex:1;}
  .rolebtn{
    font-family:inherit;font-size:12.5px;font-weight:600;border:1px solid rgba(255,255,255,.2);
    background:rgba(255,255,255,.08);color:#dbe7f5;padding:7px 13px;border-radius:99px;cursor:pointer;
    display:inline-flex;align-items:center;gap:6px;transition:.12s;
  }
  .rolebtn:hover{background:rgba(255,255,255,.16);}
  .rolebtn.on{background:#fff;color:#122a44;border-color:#fff;}
  .rolebtn .badge{background:var(--critical);color:#fff;font-size:10px;border-radius:99px;padding:0 6px;min-width:16px;text-align:center;}
  .rolebtn.on .badge{background:var(--critical);color:#fff;}
  .reset{font-family:inherit;font-size:12px;background:none;border:1px solid rgba(255,255,255,.25);color:#cdddf0;padding:6px 12px;border-radius:8px;cursor:pointer;}
  .reset:hover{background:rgba(255,255,255,.12);}

  /* ── Flow ribbon ── */
  .ribbon{background:var(--surface);border-bottom:1px solid var(--hairline);padding:12px 22px;}
  .ribinner{max-width:1120px;margin:0 auto;display:flex;align-items:flex-start;gap:0;}
  .rnode{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;position:relative;}
  .rnode .dot{
    width:30px;height:30px;border-radius:50%;background:#eceae4;color:var(--ink-3);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;
    border:2px solid #dedcd5;z-index:2;transition:.2s;
  }
  .rnode.done .dot{background:var(--good);color:#fff;border-color:var(--good);}
  .rnode.active .dot{background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft);}
  .rnode .lbl{font-size:10.5px;margin-top:5px;color:var(--ink-2);line-height:1.2;max-width:96px;}
  .rnode.active .lbl{color:var(--brand-dark);font-weight:700;}
  .rnode .line{position:absolute;top:15px;left:50%;width:100%;height:2px;background:#dedcd5;z-index:1;}
  .rnode.done .line{background:var(--good);}
  .rnode:last-child .line{display:none;}

  /* ── Coach banner ── */
  .coach{max-width:1120px;margin:14px auto 0;padding:0 22px;}
  .coach-in{
    background:var(--brand-soft);border:1px solid #bcd6f4;border-left:4px solid var(--brand);
    border-radius:11px;padding:11px 15px;display:flex;align-items:center;gap:11px;font-size:13px;color:#173e66;
  }
  .coach-in.act{background:var(--good-bg);border-color:#bfe3bf;border-left-color:var(--good);color:var(--good-text);}
  .coach-in .em{font-size:17px;}
  .coach-in b{font-weight:700;}
  .coach-in .go{margin-left:auto;font-family:inherit;font-size:12px;font-weight:700;background:var(--brand);color:#fff;border:none;padding:7px 14px;border-radius:8px;cursor:pointer;white-space:nowrap;}
  .coach-in .go:hover{background:var(--brand-dark);}

  /* ── Main ── */
  .main{max-width:1120px;margin:0 auto;padding:18px 22px 70px;}
  .viewhead{display:flex;align-items:center;gap:11px;margin-bottom:4px;}
  .viewhead .ic{font-size:24px;}
  .viewhead h1{font-size:20px;}
  .viewhead .en{font-size:12px;color:var(--ink-3);}
  .viewhead .who{margin-left:auto;font-size:11.5px;color:var(--ink-2);background:var(--surface);border:1px solid var(--hairline);padding:5px 11px;border-radius:8px;}
  .viewsub{color:var(--ink-2);font-size:13px;margin-bottom:16px;}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:16px;}
  .card-h{padding:12px 16px;border-bottom:1px solid var(--hairline);font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:8px;background:#f7f7f4;}
  .card-h .cnt{font-size:11px;color:var(--ink-3);font-weight:400;margin-left:auto;}
  .card-b{padding:16px;}

  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  thead th{text-align:left;font-size:11px;color:var(--ink-3);font-weight:600;padding:9px 12px;border-bottom:1px solid var(--hairline);white-space:nowrap;}
  tbody td{padding:10px 12px;border-bottom:1px solid var(--hairline);vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr.clk{cursor:pointer;}
  tbody tr.clk:hover{background:#f3f6fb;}
  tbody tr.sel{background:#eef4fc;}
  .code{font-weight:700;font-variant-numeric:tabular-nums;}
  .muted{color:var(--ink-3);font-size:11.5px;}
  .amt{font-variant-numeric:tabular-nums;font-weight:600;}

  .st{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap;}
  .st .d{width:6px;height:6px;border-radius:50%;}
  .st-pending{background:var(--warning-bg);color:var(--warning-text);} .st-pending .d{background:var(--warning);}
  .st-approved{background:var(--brand-soft);color:var(--brand-dark);} .st-approved .d{background:var(--brand);}
  .st-dispatched{background:var(--violet-bg);color:var(--violet);} .st-dispatched .d{background:var(--violet);}
  .st-billed{background:var(--orange-bg);color:var(--orange-text);} .st-billed .d{background:var(--orange);}
  .st-paid{background:var(--aqua-bg);color:var(--aqua-text);} .st-paid .d{background:var(--aqua);}
  .st-accepted{background:var(--brand-soft);color:var(--brand-dark);} .st-accepted .d{background:var(--brand);}
  .st-inprogress{background:#e6f7 f0;background:var(--aqua-bg);color:var(--aqua-text);} .st-inprogress .d{background:var(--aqua);animation:blink 1s infinite;}
  .st-completed{background:var(--good-bg);color:var(--good-text);} .st-completed .d{background:var(--good);}
  @keyframes blink{50%{opacity:.3;}}

  .btn{font-family:inherit;font-size:13px;font-weight:600;border:none;border-radius:9px;padding:9px 15px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;}
  .btn-p{background:var(--brand);color:#fff;} .btn-p:hover{background:var(--brand-dark);}
  .btn-g{background:var(--good);color:#fff;} .btn-g:hover{filter:brightness(.94);}
  .btn-o{background:var(--surface);border:1px solid var(--hairline);color:var(--ink-1);font-weight:500;} .btn-o:hover{background:#f2f2ef;}
  .btn-sm{font-size:12px;padding:6px 11px;}
  .btn:disabled{opacity:.4;cursor:not-allowed;}

  .field{margin-bottom:11px;}
  .field label{display:block;font-size:12px;color:var(--ink-2);margin-bottom:4px;}
  .field label .en{color:var(--ink-3);font-size:10px;}
  .field input,.field select,.field textarea{
    width:100%;font-family:inherit;font-size:13px;padding:8px 11px;border:1px solid var(--hairline);
    border-radius:8px;background:#fff;color:var(--ink-1);
  }
  .field input:focus,.field select:focus{outline:2px solid var(--brand-soft);border-color:var(--brand);}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;}
  .span2{grid-column:span 2;}

  .empty{padding:30px;text-align:center;color:var(--ink-3);font-size:13px;}

  /* tiles */
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px;}
  .tile{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:13px 15px;}
  .tile .k{font-size:11.5px;color:var(--ink-2);}
  .tile .k .en{display:block;font-size:10px;color:var(--ink-3);}
  .tile .v{font-size:24px;font-weight:700;margin-top:3px;}
  .tile .v .u{font-size:12px;font-weight:400;color:var(--ink-3);}

  /* slip */
  .slip{max-width:360px;margin:0 auto;border:1px solid var(--hairline);border-radius:12px;padding:18px 20px;background:#fff;}
  .slip .sh{text-align:center;border-bottom:2px dashed var(--hairline);padding-bottom:11px;margin-bottom:11px;}
  .slip .sh .t{font-weight:800;font-size:15px;}
  .slip .sh .no{font-family:monospace;font-size:13px;color:var(--brand-dark);margin-top:3px;}
  .slip .row{display:flex;justify-content:space-between;font-size:12.5px;padding:3px 0;}
  .slip .row .k{color:var(--ink-3);}
  .slip .tot{border-top:2px dashed var(--hairline);margin-top:9px;padding-top:9px;display:flex;justify-content:space-between;font-weight:800;font-size:15px;}
  .qr{width:96px;height:96px;margin:12px auto 4px;display:block;}

  /* gps */
  .gpsmap{position:relative;background:#eef3f0;border-radius:12px;overflow:hidden;border:1px solid var(--hairline);}
  .gpsmap svg{display:block;width:100%;height:auto;}
  .gpsinfo{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;}
  .gpsinfo .gi{background:var(--surface);border:1px solid var(--hairline);border-radius:10px;padding:9px 14px;font-size:12.5px;}
  .gpsinfo .gi b{display:block;font-size:16px;}

  /* bar chart */
  .bars{display:flex;flex-direction:column;gap:9px;}
  .barrow{display:grid;grid-template-columns:120px 1fr 40px;align-items:center;gap:10px;font-size:12px;}
  .barrow .bt{background:var(--brand);height:16px;border-radius:0 5px 5px 0;min-width:2px;}
  .barrow .bv{font-variant-numeric:tabular-nums;text-align:right;color:var(--ink-2);}

  .pill{display:inline-block;font-size:11px;padding:2px 9px;border-radius:99px;background:#eceae4;color:var(--ink-2);}
  .pill.first{background:var(--brand-soft);color:var(--brand-dark);}
  .pill.boy{background:var(--violet-bg);color:var(--violet);}

  .flash{animation:flash 1.4s ease;}
  @keyframes flash{0%{background:#fff6d9;}100%{background:transparent;}}

  @media (max-width:720px){
    .grid2{grid-template-columns:1fr;} .span2{grid-column:span 1;}
    .rnode .lbl{display:none;} .hide-sm{display:none;}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">🚛 ระบบจัดการรถสไลด์ &amp; จองคิว<small>Interactive Prototype · เดินตาม Flow 7 ขั้น</small></div>
  <div class="roles" id="roles"></div>
  <button class="reset" onclick="resetDemo()">↺ เริ่มสาธิตใหม่</button>
</div>

<div class="ribbon"><div class="ribinner" id="ribbon"></div></div>
<div class="coach"><div class="coach-in" id="coach"></div></div>

<div class="main" id="main"></div>

<script>
/* ═══════════════════ MASTER DATA ═══════════════════ */
const VEHICLES = [
  {plate:"70-1234", model:"HINO 300 (สไลด์)", owner:"first", status:"active"},
  {plate:"70-5678", model:"ISUZU NPR 150 (สไลด์)", owner:"first", status:"active"},
  {plate:"71-9012", model:"FUSO Canter FE85 (สไลด์)", owner:"first", status:"active"},
  {plate:"72-3456", model:"HINO 500 FC9J (สไลด์)", owner:"boy", status:"active"},
  {plate:"72-7890", model:"ISUZU FRR 190 (สไลด์)", owner:"boy", status:"spare"},
];
const OWNERS = {first:"เฟิร์ส", boy:"บอย"};
// คนขับประจำรถวันนี้
const DRIVER_OF = {
  "70-1234":"สมชาย ใจดี", "70-5678":"ประสิทธิ์ ตั้งใจ",
  "71-9012":"อำนาจ พากเพียร", "72-3456":"วิชัย มั่นคง", "72-7890":"เกียรติ สำรอง"
};
const DRIVERS = [...new Set(Object.values(DRIVER_OF))];

/* ═══════════════════ FLOW DEFINITION ═══════════════════ */
// current step (1-7) per status, + who should act next, + hint
const FLOW = {
  pending:    {step:2, label:"รออนุมัติ",        role:"admin",      hint:"งานเข้าคิวรออนุมัติแล้ว — สลับไปบทบาท <b>แอดมิน</b> เพื่อตรวจสอบและอนุมัติ"},
  approved:   {step:3, label:"อนุมัติแล้ว",       role:"admin",      hint:"อนุมัติแล้ว — ที่บทบาท <b>แอดมิน</b> กด “จ่ายงาน” เพื่อจับคู่รถและคนขับ"},
  dispatched: {step:4, label:"จ่ายงานแล้ว",       role:"sales",      hint:"จ่ายงานแล้ว — สลับไปบทบาท <b>เซลล์</b> เพื่อออกใบจองคิว"},
  billed:     {step:4, label:"ออกใบจอง รอชำระ",   role:"accounting", hint:"ออกใบจองแล้ว — สลับไปบทบาท <b>บัญชี</b> เพื่อยืนยันการชำระเงิน"},
  paid:       {step:5, label:"ชำระเงินแล้ว",       role:"driver",     hint:"ชำระเงินแล้ว งานเด้งเข้าแอปคนขับ — สลับไปบทบาท <b>คนขับ</b> เพื่อรับงาน"},
  accepted:   {step:6, label:"คนขับรับงาน",        role:"driver",     hint:"คนขับรับงานแล้ว — ที่บทบาท <b>คนขับ</b> กด “ออกเดินทาง” เพื่อเริ่มส่ง GPS"},
  inprogress: {step:6, label:"กำลังปฏิบัติงาน",    role:"driver",     hint:"รถกำลังวิ่ง — ดู GPS เรียลไทม์ได้ที่บทบาท <b>เซลล์</b> หรือกด “ปิดงาน” ที่บทบาทคนขับเมื่อถึงปลายทาง"},
  completed:  {step:7, label:"เสร็จสิ้น",          role:"executive",  hint:"ปิดงานเรียบร้อย — สลับไปบทบาท <b>ผู้บริหาร</b> เพื่อดูงานนี้เข้าแดชบอร์ด"},
};
const STEPS = ["จองคิว","อนุมัติ","จ่ายงาน","ใบจอง+ชำระ","รับงาน","ปฏิบัติงาน+GPS","ปิดงาน"];
const ROLES = [
  {key:"sales",      ic:"🧑‍💼", name:"เซลล์/ผู้จองคิว", en:"Sales"},
  {key:"admin",      ic:"🛡️",  name:"แอดมิน",          en:"Admin"},
  {key:"accounting", ic:"💰",  name:"บัญชี",           en:"Accounting"},
  {key:"driver",     ic:"🚚",  name:"คนขับ",           en:"Driver"},
  {key:"executive",  ic:"👔",  name:"ผู้บริหาร",        en:"Executive"},
];
const ST_LABEL = k => FLOW[k] ? FLOW[k].label : k;

/* ═══════════════════ STATE ═══════════════════ */
let S, seq, activeDriver, gpsTimer=null;
const now = new Date();
const hhmm = d => String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
const fmtB = n => Number(n).toLocaleString("th-TH");

function seed(){
  seq = 2406;
  activeDriver = "สมชาย ใจดี";
  S = {
    role:"sales",
    activeId:null,
    bookings:[
      mkBk("BK-2401","อู่สมพงษ์การช่าง","081-234-5678","รถเก๋ง Toyota Vios","ถ.มิตรภาพ กม.5","ศูนย์บริการโคราช",3500,"70-5678","completed"),
      mkBk("BK-2402","บจก.ขนส่งรุ่งเรือง","089-555-1212","รถกระบะ Isuzu","อ.ปากช่อง","อ.เมืองนครราชสีมา",5200,"72-3456","completed"),
      mkBk("BK-2403","คุณวิภา (ลูกค้าทั่วไป)","092-888-4141","รถ SUV Honda CR-V","ถ.สุรนารายณ์","อู่กลางเมือง",4200,"70-1234","paid"),
      mkBk("BK-2404","เต็นท์รถหนองบัว","084-777-2020","รถเก๋ง Mazda 2","อ.โนนสูง","ตลาดรถมือสอง",2800,null,"billed"),
      mkBk("BK-2405","คุณธนา","086-121-3434","รถตู้ Hyundai H1","ถ.ช้างเผือก","ศูนย์ซ่อมสี",3900,null,"pending"),
    ],
  };
  // pre-fill downstream fields for seeded items
  S.bookings.forEach(b=>{
    if(["dispatched","billed","paid","accepted","inprogress","completed"].includes(b.status) && b.vehicle){
      b.driver = DRIVER_OF[b.vehicle];
    }
    if(["billed","paid","accepted","inprogress","completed"].includes(b.status)) b.slipNo = "S"+b.code.slice(3);
    if(["paid","accepted","inprogress","completed"].includes(b.status)) b.paidAt = "09:1"+(b.code.slice(-1));
    if(b.status==="completed"){ b.gps=100; b.doneAt="วันนี้"; }
  });
}
function mkBk(code,customer,phone,carType,from,to,amount,vehicle,status){
  return {code,customer,phone,carType,from,to,amount,vehicle,driver:null,status,
          slipNo:null,paidAt:null,gps:0,when:"วันนี้ "+hhmm(now),owner:vehicle?VEHICLES.find(v=>v.plate===vehicle).owner:null};
}
const byId = code => S.bookings.find(b=>b.code===code);
const active = () => S.activeId ? byId(S.activeId) : null;

/* ═══════════════════ ACTIONS ═══════════════════ */
function createBooking(f){
  const code = "BK-"+(++seq);
  const b = mkBk(code, f.customer||"ลูกค้าใหม่", f.phone||"-", f.carType||"-", f.from||"-", f.to||"-", +f.amount||0, null, "pending");
  S.bookings.unshift(b);
  S.activeId = code;
  toast = code;
  render();
}
function approve(code){ const b=byId(code); b.status="approved"; if(sameActive(code))S.activeId=code; render(); }
function dispatchJob(code, vehicle){
  const b=byId(code); b.vehicle=vehicle; b.owner=VEHICLES.find(v=>v.plate===vehicle).owner;
  b.driver=DRIVER_OF[vehicle]; b.status="dispatched"; render();
}
function issueSlip(code){ const b=byId(code); b.slipNo="S"+code.slice(3); b.status="billed"; render(); }
function confirmPay(code){ const b=byId(code); b.paidAt=hhmm(new Date()); b.status="paid"; render(); }
function acceptJob(code){ const b=byId(code); b.status="accepted"; render(); }
function startTrip(code){
  const b=byId(code); b.status="inprogress"; b.gps=3;
  if(gpsTimer) clearInterval(gpsTimer);
  gpsTimer=setInterval(()=>{
    const bb=byId(code); if(!bb||bb.status!=="inprogress"){clearInterval(gpsTimer);return;}
    bb.gps=Math.min(100, bb.gps+6);
    if(S.role==="sales"||S.role==="driver") render();
    if(bb.gps>=100) clearInterval(gpsTimer);
  },1100);
  render();
}
function closeJob(code){ const b=byId(code); b.status="completed"; b.gps=100; b.doneAt="วันนี้ "+hhmm(new Date()); if(gpsTimer)clearInterval(gpsTimer); render(); }
function sameActive(code){ return true; }
let toast=null;

/* ═══════════════════ RENDER ═══════════════════ */
function setRole(r){ S.role=r; render(); }
function pick(code){ S.activeId=code; render(); }
function resetDemo(){ if(gpsTimer)clearInterval(gpsTimer); seed(); render(); }

function render(){
  renderRoles(); renderRibbon(); renderCoach();
  const m=document.getElementById("main");
  m.innerHTML = ({sales:vSales,admin:vAdmin,accounting:vAcct,driver:vDriver,executive:vExec}[S.role])();
  if(toast){ const el=document.querySelector('[data-code="'+toast+'"]'); if(el)el.classList.add("flash"); toast=null; }
}

function renderRoles(){
  const pend = S.bookings.filter(b=>b.status==="pending").length;
  const billed = S.bookings.filter(b=>b.status==="billed").length;

function qrSVG(seed){
  let h=0; for(const c of seed) h=(h*31+c.charCodeAt(0))>>>0;
  let cells="";
  for(let y=0;y<9;y++)for(let x=0;x<9;x++){ h=(h*1103515245+12345)>>>0; if((h>>7&1)||x<1||y<1||x>7||y>7&&false){} if((h>>9&1))cells+=`<rect x="${x*10+3}" y="${y*10+3}" width="9" height="9"/>`; }
  return `<svg class="qr" viewBox="0 0 96 96"><rect width="96" height="96" fill="#fff"/><g fill="#0b0b0b">${cells}<rect x="3" y="3" width="26" height="26" fill="none" stroke="#0b0b0b" stroke-width="5"/><rect x="67" y="3" width="26" height="26" fill="none" stroke="#0b0b0b" stroke-width="5"/><rect x="3" y="67" width="26" height="26" fill="none" stroke="#0b0b0b" stroke-width="5"/></g></svg>`;
}

  // path points

  return `<div class="card"><div class="card-h">🛰️ ติดตาม GPS เรียลไทม์ <span class="cnt">งาน ${b.code} · ${b.vehicle} · คนขับ ${b.driver}</span></div>
    <div class="card-b">
      <div class="gpsmap"><svg viewBox="0 0 800 200">
        <rect width="800" height="200" fill="#eef3f0"/>
        <g stroke="#d5ddd7" stroke-width="1"><line x1="0" y1="50" x2="800" y2="50"/><line x1="0" y1="100" x2="800" y2="100"/><line x1="0" y1="150" x2="800" y2="150"/>
        <line x1="200" y1="0" x2="200" y2="200"/><line x1="400" y1="0" x2="400" y2="200"/><line x1="600" y1="0" x2="600" y2="200"/></g>
        <path d="M40 150 Q400 -20 760 150" fill="none" stroke="#c3cec7" stroke-width="8" stroke-linecap="round"/>
        <path d="M40 150 Q400 -20 760 150" fill="none" stroke="#2a78d6" stroke-width="8" stroke-linecap="round" stroke-dasharray="900" stroke-dashoffset="${900-pct/100*900}"/>
        <g><circle cx="40" cy="150" r="9" fill="#0ca30c"/><text x="40" y="180" text-anchor="middle" font-size="12" fill="#52514e">รับรถ</text></g>
        <g><circle cx="760" cy="150" r="9" fill="#d03b3b"/><text x="760" y="180" text-anchor="middle" font-size="12" fill="#52514e">ส่งรถ</text></g>
        <g transform="translate(${px},${py})"><circle r="15" fill="#2a78d6" opacity="0.2"/><circle r="9" fill="#2a78d6" stroke="#fff" stroke-width="2"/><text x="0" y="-18" text-anchor="middle" font-size="16">🚚</text></g>
      </svg></div>
      <div class="gpsinfo">
        <div class="gi">ความคืบหน้า<b>${pct}%</b></div>
        <div class="gi">ถึงปลายทางใน<b>${etaMin===0?"ถึงแล้ว":"~"+etaMin+" นาที"}</b></div>
        <div class="gi">สถานะ<b style="font-size:13px;color:var(--aqua-text)">${pct>=100?"ถึงปลายทาง":"กำลังเคลื่อนที่"}</b></div>
        ${who==="sales"?'<div class="gi" style="color:var(--ink-3)">อัปเดตอัตโนมัติจากมือถือคนขับ</div>':''}
      </div>
    </div></div>`;
}

/* ═══════════════════ VIEW: EXECUTIVE ═══════════════════ */
function vExec(){
  const bk=S.bookings;
  const completed=bk.filter(b=>b.status==="completed");
  const active=bk.filter(b=>["dispatched","billed","paid","accepted","inprogress"].includes(b.status));
  const revenue=bk.filter(b=>["paid","accepted","inprogress","completed"].includes(b.status)).reduce((s,b)=>s+b.amount,0);
  const usedVeh=new Set(bk.filter(b=>b.vehicle&&b.status!=="pending").map(b=>b.vehicle)).size;
  // jobs per vehicle
  const perVeh={}; VEHICLES.forEach(v=>perVeh[v.plate]=0);
  bk.forEach(b=>{ if(b.vehicle)perVeh[b.vehicle]++; });
  const maxV=Math.max(1,...Object.values(perVeh));
  // per owner revenue
  const own={first:0,boy:0};
  bk.forEach(b=>{ if(b.owner&&["paid","accepted","inprogress","completed"].includes(b.status))own[b.owner]+=b.amount; });
  return `
  <div class="viewhead"><span class="ic">👔</span><div><h1>แดชบอร์ดผู้บริหาร <span class="en">Executive Dashboard</span></h1></div>
    <span class="who">บทบาท: ผู้บริหาร · ดูอย่างเดียว</span></div>
  <div class="viewsub">ภาพรวมธุรกิจแบบเรียลไทม์ — อัปเดตอัตโนมัติเมื่อมีงานไหลผ่านระบบ (ลองปิดงานใน Flow แล้วกลับมาดูตัวเลขขยับ)</div>

  <div class="tiles">
    <div class="tile"><div class="k">งานทั้งหมดวันนี้<span class="en">Total Jobs</span></div><div class="v">${bk.length}<span class="u"> งาน</span></div></div>
    <div class="tile"><div class="k">กำลังดำเนินการ<span class="en">Active</span></div><div class="v">${active.length}<span class="u"> งาน</span></div></div>
    <div class="tile"><div class="k">เสร็จสิ้น<span class="en">Completed</span></div><div class="v" style="color:var(--good-text)">${completed.length}<span class="u"> งาน</span></div></div>
    <div class="tile"><div class="k">รายได้รวม<span class="en">Revenue</span></div><div class="v">${fmtB(revenue)}<span class="u"> ฿</span></div></div>
    <div class="tile"><div class="k">อัตราใช้รถ<span class="en">Utilization</span></div><div class="v">${usedVeh}/${VEHICLES.length}<span class="u"> คัน</span></div></div>
  </div>

  <div class="grid2" style="gap:16px;align-items:start">
    <div class="card"><div class="card-h">📊 จำนวนงานต่อรถ <span class="cnt">Jobs per Vehicle</span></div>
      <div class="card-b"><div class="bars">
        ${VEHICLES.map(v=>`<div class="barrow"><div>${v.plate} <span class="pill ${v.owner}">${OWNERS[v.owner]}</span></div>
          <div class="bt" style="width:${perVeh[v.plate]/maxV*100}%;${v.owner==='boy'?'background:var(--violet)':''}"></div>
          <div class="bv">${perVeh[v.plate]}</div></div>`).join("")}
      </div></div></div>

    <div class="card"><div class="card-h">💵 รายได้แยกตามเจ้าของรถ <span class="cnt">Revenue by Owner</span></div>
      <div class="card-b">
        <div class="barrow" style="grid-template-columns:80px 1fr 90px;margin-bottom:9px"><div>เฟิร์ส</div><div class="bt" style="width:${own.first/(Math.max(1,own.first+own.boy))*100}%"></div><div class="bv">${fmtB(own.first)} ฿</div></div>
        <div class="barrow" style="grid-template-columns:80px 1fr 90px"><div>บอย</div><div class="bt" style="width:${own.boy/(Math.max(1,own.first+own.boy))*100}%;background:var(--violet)"></div><div class="bv">${fmtB(own.boy)} ฿</div></div>
        <div style="margin-top:14px;padding:11px;background:var(--warning-bg);border:1px solid #f2d9a0;border-radius:9px;font-size:12px;color:var(--warning-text)">
          ⚠ แจ้งเตือนประกัน: รถ <b>72-7890</b> ประกันหมดอายุแล้ว · <b>70-1234</b> เหลือ 17 วัน (ดึงจาก Master Data)
        </div>
      </div></div>
  </div>

  <div class="card"><div class="card-h">📋 งานล่าสุด <span class="cnt">${bk.length} รายการ</span></div>
    <table><thead><tr><th>เลขคิว</th><th>ลูกค้า</th><th>รถ · เจ้าของ</th><th>ค่าบริการ</th><th>สถานะ</th></tr></thead>
      <tbody>${bk.map(b=>`<tr><td class="code">${b.code}</td><td>${b.customer}</td><td>${vehLabel(b.vehicle)}</td>
        <td class="amt">${fmtB(b.amount)} ฿</td><td>${chip(b.status)}</td></tr>`).join("")}</tbody></table>
  </div>`;
}

/* ═══════════════════ INIT ═══════════════════ */
seed();
render();
</script>
</body>
</html>
