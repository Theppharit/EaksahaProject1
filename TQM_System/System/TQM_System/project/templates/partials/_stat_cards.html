{% comment %} ตัวเลขสรุป 4 ช่อง — รับตัวแปร: stat_cards {% endcomment %}

<div class="grid-stats">
  {% for card in stat_cards %}
    <div class="stat">
      <div class="stat-icon">
        {% if card.key == "open" %}<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        {% elif card.key == "waiting" %}<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2" stroke-linecap="round"/></svg>
        {% elif card.key == "in_progress" %}<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M10 17h4V5H2v12h3"/><circle cx="7.5" cy="17.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/></svg>
        {% else %}<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 6 9 17l-5-5" stroke-linecap="round"/></svg>{% endif %}
      </div>
      <div class="min-w-0">
        <p class="stat-label">{{ card.label }}</p>
        <p class="stat-value">{{ card.value }}<span class="stat-unit">รายการ</span></p>
      </div>
    </div>
  {% endfor %}
</div>
