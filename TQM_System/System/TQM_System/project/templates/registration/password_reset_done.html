{% extends "base.html" %}
{% load static %}
{% block title %}ส่งลิงก์แล้ว{% endblock %}
{% block body %}
<div class="auth-bg" style="--auth-image: url('{% static 'img/bg-login.png' %}')">
  <main class="auth-main"><div class="auth-box"><div class="auth-card">
    <div class="auth-card-stripe"></div>
    <div class="auth-card-body space-y-4 text-center">
      <div class="mx-auto grid size-14 place-items-center rounded-full bg-green-50 text-green-600">
        <svg class="size-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 6 9 17l-5-5"/></svg>
      </div>
      <h1 class="auth-title">ส่งลิงก์เรียบร้อย</h1>
      <p class="text-sm text-neutral-600">เราส่งลิงก์ตั้งรหัสผ่านใหม่ไปที่อีเมลของคุณแล้ว กรุณาตรวจกล่องจดหมาย (รวมถึงโฟลเดอร์สแปม)</p>
      <a href="{% url 'accounts:login' %}" class="btn btn-brand btn-lg">กลับหน้าเข้าสู่ระบบ</a>
    </div>
  </div></div></main>
</div>
{% endblock %}
