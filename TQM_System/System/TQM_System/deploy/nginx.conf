# ============================================================
# nginx — รับคำขอจากอินเทอร์เน็ต แล้วส่งต่อให้ gunicorn
# ------------------------------------------------------------
# ติดตั้งบนเซิร์ฟ:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/tqm
#   sudo ln -s /etc/nginx/sites-available/tqm /etc/nginx/sites-enabled/
#   sudo nginx -t          # ตรวจไวยากรณ์ก่อนเสมอ
#   sudo systemctl reload nginx
#
# ใบรับรอง HTTPS ฟรี (ทำหลังตั้ง nginx เสร็จ):
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d tqm.eaksaha.co.th
#   → certbot จะเติมบล็อก HTTPS และตั้งต่ออายุอัตโนมัติให้เอง
#
# ⚠ เปลี่ยน tqm.eaksaha.co.th เป็นโดเมนจริงก่อนใช้
# ============================================================

upstream tqm_app {
    server unix:/run/tqm/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    server_name tqm.eaksaha.co.th;

    # ขนาดไฟล์อัปโหลดสูงสุด (รูปถ่ายรถ) — ต้องไม่น้อยกว่าที่ตั้งใน settings.py
    client_max_body_size 10M;

    # ── ไฟล์ static: ให้ nginx ส่งเองเลย ไม่ต้องผ่าน Python ──
    # (WhiteNoise ใส่ hash ท้ายชื่อไฟล์ให้แล้ว cache ยาว ๆ ได้ปลอดภัย)
    location /static/ {
        alias /srv/tqm/staticfiles/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # ── ไฟล์ที่ผู้ใช้อัปโหลด ──
    location /media/ {
        alias /var/www/tqm/media/;
        expires 7d;
        access_log off;
    }

    # ── ที่เหลือส่งต่อให้ Django ──
    location / {
        proxy_pass http://tqm_app;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # header นี้สำคัญ — บอก Django ว่าคำขอเดิมมาแบบ https
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_redirect off;
        proxy_read_timeout 60s;
    }
}
